name: Build Sakinah APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 جلب ملفات الكود
        uses: actions/checkout@v4

      - name: ☕ تثبيت بيئة الجافا
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 تثبيت بيئة فلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: ⚡ إصلاح كود الأندرويد تلقائياً
        run: |
          sed -i '/flutterEmbedding/d' android/app/src/main/AndroidManifest.xml || true
          rm -rf android/app/src/main/kotlin/* || true
          rm -rf android/app/src/main/java/* || true
          mkdir -p android/app/src/main/kotlin/com/example/sakina
          cat << 'EOF' > android/app/src/main/kotlin/com/example/sakina/MainActivity.kt
          package com.example.sakina
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()
          EOF

      - name: 📦 تحميل المكتبات
        run: flutter pub get

      - name: 🚀 بناء ملف الـ APK النهائي
        run: flutter build apk --release

      - name: 📤 رفع واستخراج ملف التطبيق
        uses: actions/upload-artifact@v4
        with:
          name: Sakinah-App-Release
          path: build/app/outputs/flutter-apk/app-release.apk
