name: Build Sakinah APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 جلب ملفات الكود
        uses: actions/checkout@v4

      - name: ☕ تثبيت بيئة الجافا
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: 🐦 تثبيت بيئة فلاتر
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.10.5'

      - name: 📦 تحميل المكتبات تلقائياً
        run: flutter pub get

      - name: 🚀 بناء ملف الـ APK النهائي لتطبيق سكينة
        run: flutter build apk --release --no-sound-null-safety

      - name: 📤 رفع واستخراج ملف التطبيق للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Sakinah-App-Release
          path: build/app/outputs/flutter-apk/app-release.apk
